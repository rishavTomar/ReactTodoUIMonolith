name: Practise

trigger: 
  branches:
    include:
    - main

pool:
  vmImage: 'ubuntu-latest'
  


variables:
  FIRST_NAME: 'Rishav'
  LAST_NAME: 'Tomar'

stages:
- stage: BUILD_STAGE
  displayName: APP_BUILDING_STAGE
  jobs:
  - job: BUILD_JOB
    displayName: APP_BUILDING_JOB
    steps:
    - task: CmdLine@2
      inputs:
        script: |
          echo Write your commands here
          
          echo Hello world $(FIRST_NAME)





